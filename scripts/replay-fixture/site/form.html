<!doctype html><html><head><meta charset="utf-8"><title>Acme Filing · Your details</title>
<link rel="stylesheet" href="style.css"><script src="/config.js"></script><script src="app.js"></script></head>
<body><h1>Your details</h1>
<form id="f"></form><p class="error" id="err"></p>
<script>
ready(() => {
const name = `<label for="${id("fullname")}">Full name</label><input id="${id("fullname")}">`;
const pan = `<label for="${id("pan")}">PAN</label><input id="${id("pan")}" maxlength="10" placeholder="ABCDE1234F">`;
const income = `<label for="${id("income")}">Annual income (₹)</label><input id="${id("income")}" inputmode="numeric">`;
const regime = `<label for="${id("regime")}">Tax regime</label><select id="${id("regime")}"><option value="">Choose…</option><option value="new">New regime</option><option value="old">Old regime</option></select>`;
const gains = `<label><input type="checkbox" id="${id("has-gains")}" style="width:auto"> I sold shares or property this year</label>
  <div id="gains-box" class="hidden"><label for="${id("gains")}">Capital gains (₹)</label><input id="${id("gains")}" inputmode="numeric"></div>`;
// Drift moves the PAN above the name and the regime above the income.
$("#f").innerHTML = (F.drift ? [pan, name, regime, income, gains] : [name, pan, income, regime, gains]).join("")
  + `<button type="submit">${L("Continue", "Next step")}</button>`;
moneyMask($("#" + id("income"))); moneyMask($("#" + id("gains")));
$("#" + id("has-gains")).onchange = (e) => $("#gains-box").classList.toggle("hidden", !e.target.checked);
$("#f").onsubmit = (e) => {
  e.preventDefault();
  if (blocked()) return;
  const v = (n) => $("#" + id(n)).value.trim();
  if (!/^[A-Z]{5}[0-9]{4}[A-Z]$/.test(v("pan"))) { $("#err").textContent = "PAN should look like ABCDE1234F"; return; }
  if (!v("fullname") || !digits(v("income")) || !v("regime")) { $("#err").textContent = "Fill every field"; return; }
  const hasGains = $("#" + id("has-gains")).checked;
  save({ name: v("fullname"), pan: v("pan"), income: digits(v("income")), regime: v("regime"),
         gains: hasGains ? digits(v("gains")) : "" });
  // Random: sometimes a page nobody recorded comes first.
  location.href = chance(0.5) ? "verify.html" : "deductions.html";
};
banner(); survey(); staySignedIn(); noise();
});
</script></body></html>
