<!doctype html><html><head><meta charset="utf-8"><title>Acme Filing · Security check</title>
<link rel="stylesheet" href="style.css"><script src="/config.js"></script><script src="app.js"></script></head>
<body><h1>Security check</h1><p>Verify you are human to continue to your return.</p>
<div class="captcha" data-sitekey="fixture-key"><label><input type="checkbox" id="robot" style="width:auto"> I'm not a robot</label>
<iframe id="widget" src="recaptcha-frame.html?k=fixture" width="304" height="78" title="reCAPTCHA" style="border:0;display:none"></iframe>
<textarea name="g-recaptcha-response" style="display:none"></textarea></div>
<button type="button" id="human-continue" disabled>Continue</button>
<script>
// Only a person passes this: the replay hands the page over and takes it back once it's gone.
const next = new URLSearchParams(location.search).get("next") || "form.html";
// captchaSlow: a real widget frame stays on the page once ticked (only its token says it's solved), and
// Continue goes through a slow sign-in page first.
if (F.captchaSlow) $("#widget").style.display = "block";
$("#robot").onchange = (e) => {
  $("#human-continue").disabled = !e.target.checked;
  document.querySelector("textarea[name=g-recaptcha-response]").value = e.target.checked ? "03AFcWeA" + "x".repeat(40) : "";
};
$("#human-continue").onclick = () => {
  sessionStorage.setItem("human", "1");
  location.href = F.captchaSlow ? "loading.html?next=" + encodeURIComponent(next) : next;
};
</script></body></html>
